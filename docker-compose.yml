services:
  stripe-eventsair-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stripe-eventsair-webhook
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./.runtime:/app/.runtime
